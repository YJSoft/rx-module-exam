<h3>{$examitem->getTitle()}</h3>
<div class="sc_tp">
    <div class="fl">
        <block cond="$examitem->isGranted()">
        <a href="{getUrl('act','dispExamEditMode')}" class="btn"><i class="bi bi-pencil-square" aria-hidden="true"></i> {$lang->cmd_change_editmode}</a>
        </block>
    </div>
    <p class="qcnt">
        총 <span id="total_q_count">{$display_question_count}</span> 문항
        총 <span id="total_q_point">{$display_total_point}</span> 점
    </p>
    <p class="fr">
        <label for="member_name">이 름 : <input type="text" name="member_name" id="member_name" value="{$logged_info->nick_name}" class="underInput" /></label>
        <label for="member_score">점 수 : <input type="text" name="member_score" id="member_score" value="" readonly="readonly" class="underInput" /></label>
    </p>
</div>
<div id="examTimer" class="cd" cond="$mode=='join' && !$is_practice && $examitem->isTime() && $examitem->get('exam_time')" data-value="{$remaining_exam_time}"></div>
<div id="questions" class="questions" data-exam-srl="{$examitem->document_srl}" data-member-srl="{(int)($logged_info->member_srl ?? 0)}" data-exam-completed="{($resultitem && $mode!='join')?'Y':'N'}">
    <include target="_paper_message.html" cond="!$mode" />
    <include target="_paper_questions.html" cond="$mode=='join'" />
</div>
